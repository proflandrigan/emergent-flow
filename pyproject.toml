[build-system]
requires = ["setuptools>=77"]
# In-tree backend shim (build_backend.py): runs `vite build ui/` -> colonymind/_static/
# on a real wheel build, best-effort. See ADR 0013 Decision 1.
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "colonymind"
dynamic = ["version"]
description = "Colony Mind — core SDK and graph intermediate representation (IR)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Colony Mind" },
]
keywords = ["data-science", "machine-learning", "visual-programming", "graph", "ir"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5,<3",
    # Story 8 functional-pipeline vertical slice. These are hard (required)
    # dependencies: the SDK's first concrete node families are thin wrappers
    # over these trusted libraries (see docs/sdk-design-philosophy.md).
    "pandas>=2,<3",
    # statsmodels (BSD-3-Clause) backs cm.stats.anova. It replaced pingouin,
    # which is GPL-3.0 and incompatible with this SDK's Apache-2.0 license
    # (see docs/licensing-and-dependencies.md).
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.4",
    "ydata-profiling>=4",
    # ydata-profiling imports pkg_resources at runtime but does not declare
    # setuptools as a dependency. Pin it explicitly, and below 81 where
    # pkg_resources was removed, so the report family imports cleanly.
    "setuptools>=68,<81",
    # ADR 0008: compile_to_code runs a `ruff format` pass on every emitted
    # module, so ruff is a runtime dependency, not just a dev tool.
    "ruff>=0.6",
    # ADR 0008: the declarative (nn.Module) codegen branch assembles a real
    # concrete syntax tree with libcst rather than splicing strings, so libcst
    # is a runtime dependency of compile_to_code for DECLARATIVE graphs.
    "libcst>=1.1",
]

[project.urls]
Homepage = "https://github.com/proflandrigan/colony-mind"
Repository = "https://github.com/proflandrigan/colony-mind"
Issues = "https://github.com/proflandrigan/colony-mind/issues"

# ADR 0013 Decision 2 / roadmap §A6: `pip install colonymind` provides a launch
# command that boots the thin local canvas server, calling cm.* in-process. The
# v0 uses the stdlib http.server, so this adds no runtime dependencies.
[project.scripts]
colonymind = "colonymind.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "mypy>=1.11",
    "syrupy>=4",
]

[tool.setuptools.dynamic]
version = { attr = "colonymind.__version__" }

[tool.setuptools.packages.find]
include = ["colonymind*"]

# The built canvas (vite build ui/ -> colonymind/_static/, ADR 0013 Decision 1) ships in
# the wheel as package data. Absent in a source build (no Node) -> nothing is bundled and
# the server serves its demo page. Two globs cover top-level and nested asset files.
[tool.setuptools.package-data]
colonymind = ["_static/*", "_static/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "equivalence: ADR-0002 (A2) execute(ir) == run(compile_to_code(ir)) gate",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: the IR enums deliberately subclass (str, Enum) for stable JSON serialization
# semantics; migrating them to enum.StrEnum changes str()/value behavior and is out of
# scope here (see colonymind/ir/common.py).
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
files = ["colonymind"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# Story 8 wrapped libraries that ship no type stubs / py.typed marker. Treat
# their imports as untyped so mypy stays green without vendoring stubs; the
# wrappers themselves remain fully annotated at their public boundary. `torch`
# is here for a different reason: it is intentionally NOT a dependency (the
# declarative codegen seam imports it lazily, only when actually running an
# nn.Module), so it is absent in CI — ignore its missing import.
[[tool.mypy.overrides]]
module = ["pandas.*", "statsmodels.*", "ydata_profiling.*", "sklearn.*", "torch.*"]
ignore_missing_imports = true
