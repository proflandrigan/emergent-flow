[build-system]
requires = ["setuptools>=77"]
# In-tree backend shim (build_backend.py): runs `vite build ui/` -> emergentflow/_static/
# on a real wheel build, best-effort. See ADR 0013 Decision 1.
build-backend = "build_backend"
backend-path = ["."]

[project]
name = "emergentflow"
dynamic = ["version"]
description = "Emergent Flow — core SDK and graph intermediate representation (IR)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Emergent Flow" },
]
keywords = ["data-science", "machine-learning", "visual-programming", "graph", "ir"]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.5,<3",
    # Story 8 functional-pipeline vertical slice. These are hard (required)
    # dependencies: the SDK's first concrete node families are thin wrappers
    # over these trusted libraries (see docs/sdk-design-philosophy.md).
    "pandas>=2,<3",
    # statsmodels (BSD-3-Clause) backs ef.stats.anova. It replaced pingouin,
    # which is GPL-3.0 and incompatible with this SDK's Apache-2.0 license
    # (see docs/licensing-and-dependencies.md).
    "statsmodels>=0.14,<1",
    "scikit-learn>=1.4",
    # tqdm (MIT) backs the ef.ml.compare_models progress bar over its per-estimator
    # cross-validation loop; MIT is compatible with this SDK's Apache-2.0 license (see
    # docs/licensing-and-dependencies.md). A hard dependency because the ml family always
    # needs it.
    "tqdm>=4,<5",
    # scipy (BSD-3-Clause) backs ef.stats.ttest (scipy.stats.ttest_ind). It is already present
    # transitively via scikit-learn/statsmodels, but ef.stats imports it directly, so it is
    # declared explicitly here (see docs/licensing-and-dependencies.md). Not a GPL dep.
    "scipy>=1.10",
    # pyarrow (Apache-2.0) is the parquet engine backing ef.data.load_parquet.
    # Apache-2.0 is compatible with this SDK's license (see docs/licensing-and-dependencies.md);
    # it is NOT a GPL dep. pandas.read_parquet needs an engine, so this is a hard dependency.
    "pyarrow>=15",
    # plotly (MIT) is the viz backend for Epic 12's ef.viz.plot: fig.to_json() (parsed with
    # json.loads) is JSON-native, so a PlotSpec rides the result-payload contract with no binary-artifact
    # escape hatch (see docs/licensing-and-dependencies.md). MIT is compatible with this SDK's
    # Apache-2.0 license; it is NOT a GPL dep. seaborn is deliberately NOT pulled (it would drag
    # matplotlib into the render path). A hard dependency because the viz family always needs it.
    "plotly>=5,<7",
    "ydata-profiling>=4",
    # ydata-profiling imports pkg_resources at runtime but does not declare
    # setuptools as a dependency. Pin it explicitly, and below 81 where
    # pkg_resources was removed, so the report family imports cleanly.
    "setuptools>=68,<81",
    # ADR 0008: compile_to_code runs a `ruff format` pass on every emitted
    # module, so ruff is a runtime dependency, not just a dev tool.
    "ruff>=0.6",
    # ADR 0008: the declarative (nn.Module) codegen branch assembles a real
    # concrete syntax tree with libcst rather than splicing strings, so libcst
    # is a runtime dependency of compile_to_code for DECLARATIVE graphs.
    "libcst>=1.1",
    # sqlglot (MIT) is the SQL dialect parser/transpiler backing Epic 13's read-only
    # validation and the structured-spec -> dialect-SQL compilation. A hard dependency
    # because the query seam always needs it; MIT is compatible with this SDK's license
    # (see docs/licensing-and-dependencies.md). Not a GPL dep.
    "sqlglot>=25,<26",
    # duckdb (MIT) is the in-process, credential-free warehouse: a real feature (query
    # local parquet/csv with zero credentials) AND the offline fixture-recording backend
    # so the Epic 13 equivalence matrix runs in CI without a cloud account. A hard
    # dependency; MIT is compatible with this SDK's license. Not a GPL dep.
    "duckdb>=1,<2",
    # tomli-w (MIT) is the TOML writer for emergentflow.connections.profiles.save_profiles --
    # stdlib tomllib is read-only, and the connection-profile store needs to persist
    # create/edit/delete operations back to connections.toml. A hard dependency because the
    # profile store is always available in a base install. Not a GPL dep.
    "tomli-w>=1,<2",
]

[project.optional-dependencies]
# `pip install emergentflow[server]` enables `emergentflow serve` on the
# FastAPI/Uvicorn transport (Epic 7 Story 3). Kept optional so a bare SDK
# install stays light (ADR 0007); the CLI prints an install hint if absent.
server = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
]
# `pip install emergentflow[llm]` enables `emergentflow.llm.gateway.GatewayClient`,
# which routes LLM completion calls through LiteLLM (MIT license, Epic 9 Story 1 /
# ADR 0017). Kept optional so a bare SDK install stays light (ADR 0007); importing
# `emergentflow.llm.gateway` without it installed raises a ModuleNotFoundError with
# an install hint.
llm = [
    "litellm>=1,<2",
]
# `pip install emergentflow[bayes]` enables the optional Bayesian modeling family
# (Epic 12 Story 7): pymc (Apache-2.0) for sampling, bambi (MIT) for the formula/structured-spec
# frontend, and arviz (Apache-2.0) for posterior summaries. Kept optional so a bare SDK install
# stays light (ADR 0007) and never pulls pytensor + a C toolchain. A Bayesian node in a base
# install raises a typed MissingOptionalDependencyError, never an opaque ImportError.
bayes = [
    "pymc>=5,<6",
    "bambi>=0.13,<1",
    "arviz>=0.17,<1",
]
# `pip install emergentflow[recommend]` enables the optional implicit-feedback matrix
# factorization algorithms (ALS, BPR) for the recommender-systems family (Epic 15, Story 8):
# implicit (MIT license) provides optimized C++/Cython-backed ALS/BPR. Kept optional so a bare
# SDK install stays light (ADR 0007); the base install covers sklearn-backed SVD/NMF
# matrix factorization without this extra. An implicit-backed recommender node invoked in a
# base install raises a typed MissingOptionalDependencyError("emergentflow[recommend]"),
# never an opaque ImportError.
recommend = [
    "implicit>=0.7,<1",
]
# `pip install emergentflow[explain]` enables the optional model-explainability family
# (SHAP-based feature attribution + error analysis, ADR 0020): shap (MIT license) computes
# per-feature attributions for a fitted ml.FittedModel. Kept optional so a bare SDK install
# stays light (ADR 0007) and never pulls numba/llvmlite. An explain.* node in a base install
# raises a typed MissingOptionalDependencyError, never an opaque ImportError.
explain = [
    "shap>=0.44,<1",
]
# `pip install emergentflow[embed]` enables the optional local text-embedding backend
# (sentence-transformers, Apache-2.0). Kept optional so a bare SDK install stays light
# (ADR 0007); the API embedding path (via GatewayClient/LiteLLM) needs only the `[llm]`
# extra. A local-backend embed node in a base install raises a typed
# MissingOptionalDependencyError, never an opaque ImportError.
embed = [
    "sentence-transformers>=3,<4",
]
# `pip install emergentflow[cloud]` enables remote object-storage URIs (`s3://`/`gs://`/`az://`)
# for the data loaders, routed through fsspec (Epic 16). fsspec, s3fs, and gcsfs are all
# BSD-3-Clause; adlfs is BSD-3-Clause — none are GPL. Kept optional so a bare SDK install stays
# light (ADR 0007) and never pulls cloud SDKs; a remote-URI load in a base install raises a typed
# MissingOptionalDependencyError, never an opaque ImportError.
cloud = [
    "fsspec>=2024.2",
    "s3fs>=2024.2",
    "gcsfs>=2024.2",
    "adlfs>=2024.2",
]
# `pip install emergentflow[excel]` enables `ef.data.load_excel`. openpyxl is MIT
# (compatible with this SDK's Apache-2.0 license; not GPL). Kept optional so a bare
# SDK install stays light (ADR 0007); a `load_excel` call in a base install raises a
# typed MissingOptionalDependencyError, never an opaque ImportError.
excel = [
    "openpyxl>=3.1,<4",
]
# `pip install emergentflow[bigquery]` enables the BigQuery warehouse adapter (Epic 13).
# google-cloud-bigquery is Apache-2.0 (compatible; not GPL). Kept optional so a bare SDK
# install stays credential-free and light (ADR 0007 / ADR 0018); a BigQuery node in a base
# install raises a typed MissingOptionalDependencyError, never an opaque ImportError.
bigquery = [
    "google-cloud-bigquery>=3,<4",
    "db-dtypes>=1,<2",
]
# `pip install emergentflow[redshift]` enables the Redshift warehouse adapter (Epic 13).
# redshift-connector is Apache-2.0 (compatible; not GPL). Kept optional (ADR 0007 / ADR 0018).
redshift = [
    "redshift-connector>=2.1,<3",
]
# `pip install emergentflow[postgres]` enables the Postgres warehouse adapter (Epic 13).
# SQLAlchemy is MIT; the psycopg driver is LGPL and therefore lives ONLY behind this extra,
# never on the hard-dep path (ADR 0018 / docs/licensing-and-dependencies.md). Kept optional.
postgres = [
    "sqlalchemy>=2,<3",
    "psycopg[binary]>=3.1,<4",
]
# `pip install emergentflow[mcp]` enables the MCP tool wrapper over the
# session/collaboration HTTP routes (Epic 14 Story 7). Kept optional so a bare
# SDK install stays light (ADR 0007); importing `emergentflow.collab.mcp`
# without it installed raises a typed `ModuleNotFoundError` with an install hint.
mcp = [
    "fastmcp>=3.4.4",
]
# `pip install emergentflow[all]` installs every optional extra in one shot —
# the server, all warehouse adapters, LLM gateway, explainability, Bayesian
# modeling, and the MCP tool wrapper. Convenient for local development or
# exploration; production installs should cherry-pick only the extras they need.
all = [
    "emergentflow[server,llm,bayes,embed,explain,cloud,excel,bigquery,redshift,postgres,mcp]",
]

[project.urls]
Homepage = "https://github.com/proflandrigan/emergent-flow"
Repository = "https://github.com/proflandrigan/emergent-flow"
Issues = "https://github.com/proflandrigan/emergent-flow/issues"

# ADR 0013 Decision 2 / roadmap §A6: `pip install emergentflow` provides a launch
# command that boots the thin local canvas server, calling ef.* in-process. The
# v0 uses the stdlib http.server, so this adds no runtime dependencies.
[project.scripts]
emergentflow = "emergentflow.cli:main"

[dependency-groups]
dev = [
    "pytest>=7",
    "mypy>=1.11",
    "syrupy>=4",
    # Server transport (Epic 7 Story 3) + its async HTTP test client. These
    # mirror the `server` optional-extra so `uv sync` (which installs the dev
    # group) keeps the FastAPI server tests runnable in CI.
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.29,<1",
    "httpx>=0.27",
    # Mirrors the `mcp` optional-extra (Epic 14 Story 7) so `uv sync` (which installs the
    # dev group) keeps tests/test_collab_mcp.py's happy-path tests -- which assume fastmcp
    # IS installed, unlike the torch/litellm-style importorskip tests -- runnable in CI.
    "fastmcp>=3.4.4",
]

[tool.setuptools.dynamic]
version = { attr = "emergentflow.__version__" }

[tool.setuptools.packages.find]
include = ["emergentflow*"]

# The built canvas (vite build ui/ -> emergentflow/_static/, ADR 0013 Decision 1) ships in
# the wheel as package data. Absent in a source build (no Node) -> nothing is bundled and
# the server serves its demo page. Two globs cover top-level and nested asset files.
[tool.setuptools.package-data]
emergentflow = ["_static/*", "_static/**/*", "agents/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "equivalence: ADR-0002 (A2) execute(ir) == run(compile_to_code(ir)) gate",
    "driver_integration: tests against a real driver (Postgres/etc.) requiring extras + a live service, run in a dedicated CI job",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# UP042: the IR enums deliberately subclass (str, Enum) for stable JSON serialization
# semantics; migrating them to enum.StrEnum changes str()/value behavior and is out of
# scope here (see emergentflow/ir/common.py).
ignore = ["UP042"]

[tool.mypy]
python_version = "3.11"
files = ["emergentflow"]
plugins = ["pydantic.mypy"]
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true

# Story 8 wrapped libraries that ship no type stubs / py.typed marker. Treat
# their imports as untyped so mypy stays green without vendoring stubs; the
# wrappers themselves remain fully annotated at their public boundary. `torch`
# is here for a different reason: it is intentionally NOT a dependency (the
# declarative codegen seam imports it lazily, only when actually running an
# nn.Module), so it is absent in CI — ignore its missing import. `litellm` is
# the same case as `torch`: it is the optional `emergentflow[llm]` extra
# (Epic 9 Story 1 / ADR 0017), imported lazily inside `GatewayClient.complete`,
# so it is absent from the bare `uv sync --locked` CI environment.
[[tool.mypy.overrides]]
module = [
    "pandas.*",
    "statsmodels.*",
    "ydata_profiling.*",
    "sklearn.*",
    "scipy.*",
    "torch.*",
    "matplotlib.*",
    "litellm.*",
    # tqdm (MIT) ships no py.typed marker; it backs the ef.ml.compare_models progress bar.
    "tqdm.*",
    # plotly (MIT) ships no py.typed marker; it is the Epic 12 viz backend, imported
    # lazily inside `ef.viz.plot`. The wrapper stays fully annotated at its boundary.
    "plotly.*",
    # The optional `emergentflow[bayes]` extra (Epic 12 Story 7): pymc/bambi/arviz are
    # imported lazily and are absent from the bare `uv sync --locked` CI env (like torch/
    # litellm), so ignore their missing imports.
    "pymc.*",
    "bambi.*",
    "arviz.*",
    # The optional warehouse extras ([bigquery]/[redshift]/[postgres], Epic 13 Story 6):
    # cloud drivers are imported lazily inside each adapter and are absent from the bare
    # `uv sync --locked` CI env (like torch/litellm), so ignore their missing imports.
    "google.cloud.*",
    "redshift_connector.*",
    "psycopg.*",
    "sqlalchemy.*",
    # The optional `emergentflow[explain]` extra (ADR 0020): shap ships no type stubs and is
    # imported lazily inside `emergentflow/explain/_shap.py`, absent from the bare
    # `uv sync --locked` CI env (like torch/litellm/pymc).
    "shap.*",
    # The optional `emergentflow[recommend]` extra (Epic 15 Story 8): implicit ships no type
    # stubs and is imported lazily inside `emergentflow/recommend/catalog.py`'s ALS/BPR
    # fitters, absent from the bare `uv sync --locked` CI env (like torch/litellm/pymc).
    "implicit.*",
    # The optional `emergentflow[embed]` extra: sentence-transformers is imported lazily
    # inside `emergentflow/embed/__init__.py`, absent from the bare `uv sync --locked`
    # CI env (like torch/litellm/pymc).
    "sentence_transformers.*",
    # The optional `emergentflow[cloud]` extra (Epic 16): fsspec ships no type stubs and is
    # imported lazily inside `emergentflow/data/__init__.py`'s remote-URI loaders, absent
    # from the bare `uv sync --locked` CI env (like torch/litellm/pymc).
    "fsspec.*",
]
ignore_missing_imports = true
