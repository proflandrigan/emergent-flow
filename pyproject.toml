[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "colonymind"
version = "0.1.0"
description = "Colony Mind — core SDK and graph intermediate representation (IR)."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
]

[tool.setuptools.packages.find]
include = ["colonymind*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
