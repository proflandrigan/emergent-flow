[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cm-timeseries"
version = "0.1.0"
description = "Example out-of-core Colony Mind type-token plugin (Epic 3, Story 2)."
requires-python = ">=3.11"
dependencies = ["colonymind"]

[project.entry-points."colonymind.types"]
time_series = "cm_timeseries.types:TIMESERIES"

[tool.setuptools.packages.find]
include = ["cm_timeseries*"]
