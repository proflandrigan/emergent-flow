[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ef-timeseries"
version = "0.1.0"
description = "Example out-of-core Emergent Flow type-token plugin (Epic 3, Story 2)."
requires-python = ">=3.11"
dependencies = ["emergentflow"]

[project.entry-points."emergentflow.types"]
time_series = "ef_timeseries.types:TIMESERIES"

[tool.setuptools.packages.find]
include = ["ef_timeseries*"]
