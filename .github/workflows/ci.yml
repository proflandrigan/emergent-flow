name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy emergentflow

      - name: Run tests
        run: uv run pytest

      - name: ADR-0002 equivalence gate
        run: uv run pytest -m equivalence -q

      - name: Verify generated UI contracts are up to date
        run: |
          uv run python scripts/export_ui_contracts.py
          git diff --exit-code ui/src/generated/catalog.json ui/src/generated/ir.schema.json ui/src/generated/mutation.schema.json ui/src/generated/session_event.schema.json ui/src/generated/validity_rules.json

      - name: UI boundary check (ui/ must not import emergentflow)
        run: uv run python scripts/check_ui_boundary.py

      - name: Column-effect coverage report (Epic 18 lineage)
        # Gate is on the tracer-resolvable fraction (~19% today), not the
        # broader advisory "declared" set (~27%), so --min-pct is set low.
        run: uv run python scripts/check_column_effect_coverage.py --min-pct 15

  ui:
    name: ui (canvas build & tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Verify generated TS types are up to date
        run: |
          npm run gen:types
          git diff --exit-code src/generated/ir.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

  warehouse-drivers:
    name: warehouse driver integration (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.12"

      - name: Install dependencies (locked, with postgres extra)
        run: uv sync --locked --python "3.12" --extra postgres

      - name: Run Postgres driver-integration tests
        run: uv run pytest -m driver_integration -q
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGDATABASE: postgres
          PGUSER: postgres
          PGPASSWORD: postgres

  recommend-extra:
    name: recommend equivalence ([recommend] extra)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.12"

      - name: Install dependencies (locked, with recommend extra)
        run: uv sync --locked --python "3.12" --extra recommend

      - name: "ADR-0002 equivalence gate ([recommend] extra: implicit-backed ALS/BPR)"
        run: uv run pytest -m equivalence -q

  torch-recommend:
    name: recommend equivalence (torch-backed deep models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install "3.12"

      - name: Install dependencies (locked)
        run: uv sync --locked --python "3.12"

      - name: Install torch (ad hoc, not a pyproject.toml dependency)
        run: uv pip install torch

      - name: "ADR-0002 equivalence gate (torch-backed: NCF, two-tower)"
        run: uv run pytest -m equivalence -q
