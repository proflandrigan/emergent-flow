name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: lint & test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type-check (mypy)
        run: uv run mypy emergentflow

      - name: Run tests
        run: uv run pytest

      - name: ADR-0002 equivalence gate
        run: uv run pytest -m equivalence -q

      - name: Verify generated UI contracts are up to date
        run: |
          uv run python scripts/export_ui_contracts.py
          git diff --exit-code ui/src/generated/catalog.json ui/src/generated/ir.schema.json

      - name: UI boundary check (ui/ must not import emergentflow)
        run: uv run python scripts/check_ui_boundary.py

  ui:
    name: ui (canvas build & tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies (locked)
        run: npm ci

      - name: Verify generated TS types are up to date
        run: |
          npm run gen:types
          git diff --exit-code src/generated/ir.ts

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test
